name: Build & Deploy to Hostinger (FTP)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Vite app
        run: npm run build

      - name: Remove .DS_Store files
        run: find dist -name '.DS_Store' -type f -delete

      - name: Verify only lowercase assets folder exists
        run: |
          if [ -d "dist/Assets" ]; then
            echo "ERROR: Found uppercase Assets folder in dist/"
            echo "Removing uppercase Assets folder..."
            rm -rf dist/Assets
          fi
          echo "✓ Only lowercase assets folder: $(ls -d dist/assets/)"

      - name: Deploy to Hostinger via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: dist/
          server-dir: ${{ secrets.REMOTE_DIR }}
          dangerous-clean-slate: true
          timeout: 600000
          exclude: |
            **/.DS_Store
            **/.git*
            **/node_modules/**

      - name: Deployment summary
        run: |
          echo "=========================================="
          echo "✓ Deployment Complete"
          echo "=========================================="
          echo "Files deployed to: ${{ secrets.REMOTE_DIR }}"
          echo "Only lowercase 'assets' folder included"
          echo "No uppercase 'Assets' folder present"
          echo "=========================================="
